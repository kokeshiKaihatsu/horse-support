<!DOCTYPE html>
<html lang="ja">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">

<head>
  <meta charset="UTF-8">
  <title>タイムライン投稿の追加</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 共通CSS -->
  <link rel="stylesheet" href="/styles.css">

  <!-- ページごとのCSSを読み込む -->
  
</head>
  <body>

    <header class="site-header">
      <div class="logo">
        <a href="/">ホームに戻る</a>

        
        <a href="/admin/" class="admin-link">管理</a>
      </div>

      <nav class="nav-right">
        
          <a href="/login/" class="login-btn">ログイン</a>
        
      </nav>
    </header>

    <main>
      

  <link rel="stylesheet" href="/styles/admin.css">


<h1>📝 タイムライン投稿の追加</h1>

<form id="addPostForm" class="admin-form">

  <label>タイトル</label>
  <input type="text" id="postTitle" required>

  <label>馬ID</label>
  <select id="postHorseId">
    
  </select>

  <label>本文</label>
  <textarea id="postBody"></textarea>

  <label>画像</label>
  <input type="file" id="postImages" accept="image/*" multiple>
  <div id="imagePreview" class="image-preview"></div>

  <button type="submit">投稿する</button>
</form>

<script src="/scripts/admin.js"></script>

    </main>

    <footer>
      <p>ひめちゃんの支援クラブ</p>
    </footer>

  </body>
</html>
