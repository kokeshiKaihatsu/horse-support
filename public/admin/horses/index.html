<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>馬の追加</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">

  <!-- 共通CSS -->
  <link rel="stylesheet" href="/styles.css">

  <!-- ページごとのCSSを読み込む -->
  
</head>
  <body>

    <header class="site-header">
      <div class="logo">
        <a href="/">ホームに戻る</a>

        <a
          href="/admin/"
          class="admin-link"
          id="adminLink"
          style="display:none;"
        >
          管理
        </a>
      </div>

      <nav class="nav-right">
        <a href="/login/" class="login-btn" id="userBtn">
          ログイン
        </a>
      </nav>
    </header>

    <main>
      

  <link rel="stylesheet" href="/styles/admin.css">


<h1>🐴 馬の追加</h1>

<form id="addHorseForm" class="admin-form">
  <label>馬ID（英字）</label>
  <input type="text" id="horseId" required>

  <label>名前</label>
  <input type="text" id="horseName" required>

  <label>画像</label>
  <input type="file" id="horseImage" accept="image/*">

  <div id="imagePreview" class="image-preview"></div>

  <label>説明</label>
  <textarea id="horseDesc"></textarea>

  <button type="submit" class="submit-btn">追加する</button>
</form>

<script src="/scripts/admin.js"></script>

    </main>

    <footer>
      <p>ひめちゃんの支援クラブ</p>
    </footer>

    <!-- js呼び出し -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="/scripts/base.js"></script>

  </body>
</html>
