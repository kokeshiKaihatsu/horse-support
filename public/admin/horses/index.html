<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>馬の追加</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 共通CSS -->
  <link rel="stylesheet" href="/styles.css">

  <!-- ページごとのCSSを読み込む -->
  
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <a href="/">こけし牧場</a>

      
      <a href="/admin/" class="admin-link">管理</a>
    </div>

    <nav class="nav-right">
      
        <a href="/pages/login/" class="login-btn">ログイン</a>
      
    </nav>
  </header>

  <main>
    
<h1>🐴 馬の追加</h1>

<form id="addHorseForm">
  <label>馬ID（英字）</label>
  <input type="text" id="horseId" required>

  <label>名前</label>
  <input type="text" id="horseName" required>

  <label>画像</label>
  <input type="file" id="horseImage" accept="image/*">

  <label>説明</label>
  <textarea id="horseDesc"></textarea>

  <button type="submit">追加する</button>
</form>

<script src="/scripts/admin.js"></script>

  </main>

  <footer>
    <p>ひめちゃんの支援クラブ</p>
  </footer>

</body>
</html>
