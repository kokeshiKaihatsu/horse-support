<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タイムライン投稿の追加</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 共通CSS -->
  <link rel="stylesheet" href="/styles.css">

  <!-- ページごとのCSSを読み込む -->
  
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <a href="/">こけし牧場</a>

      
      <a href="/admin/" class="admin-link">管理</a>
    </div>

    <nav class="nav-right">
      
        <a href="/pages/login/" class="login-btn">ログイン</a>
      
    </nav>
  </header>

  <main>
    
<h1>📝 タイムライン投稿の追加</h1>

<form id="addPostForm">
  <label>タイトル</label>
  <input type="text" id="postTitle" required>

  <label>馬ID</label>
  <select id="postHorseId">
    
      <option value="hime">ヒメ</option>
    
      <option value="kokeshi">ﾃﾞｰｽｹ</option>
    
  </select>

  <label>本文</label>
  <textarea id="postBody"></textarea>

  <label>画像</label>
  <input type="file" id="postImages" accept="image/*" multiple>


  <button type="submit">投稿する</button>
</form>

<script src="/scripts/admin.js"></script>

  </main>

  <footer>
    <p>ひめちゃんの支援クラブ</p>
  </footer>

</body>
</html>
