<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>馬一覧</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">

  <!-- 共通CSS -->
  <link rel="stylesheet" href="/styles.css">

  <!-- ページごとのCSSを読み込む -->
  
</head>
  <body>

    <header class="site-header">
      <div class="logo">
        <a href="/">ホームに戻る</a>

        <a
          href="/admin/"
          class="admin-link"
          id="adminLink"
          style="display:none;"
        >
          管理
        </a>
      </div>

      <nav class="nav-right">
        <a href="/login/" class="login-btn" id="userBtn">
          ログイン
        </a>
      </nav>
    </header>

    <main>
      
<link rel="stylesheet" href="/styles/horses.css">


<h2>養老馬一覧</h2>

<div class="horse-list">
  
    <div class="horse-card" data-id="hime">

      <!-- 編集ボタン（インライン編集用） -->
      <button class="edit-btn" style="display:none;">✏️</button>

      <!-- 通常表示 -->
      <div class="view-mode">
        <h3>ヒメ</h3>
        <img src="/images/horses/hime.jpg" alt="ヒメ">
        <div class="horse-info">
          <p><strong>誕生日　：</strong> 2009/03/09</p>
          <p><strong>年齢　　：</strong> 17</p>
          <p><strong>特徴　　：</strong> やちぷえさんのひめ</p>
        </div>
      </div>
     <!-- 編集モード（最初は非表示） -->
      <div class="edit-mode" style="display:none;">
        <label>名前</label>
        <input type="text" class="edit-name" value="ヒメ">

        <label>画像</label>
        <input type="file" class="edit-image-file" accept="image/*">

        <label>誕生日</label>
        <input type="text" class="edit-birthday" value="2009/03/09">

        <label>特徴</label>
        <textarea class="edit-desc">やちぷえさんのひめ</textarea>

        <button class="save-btn">保存</button>
        <button class="cancel-btn">キャンセル</button>
      </div>
    </div>
  
    <div class="horse-card" data-id="kokeshi">

      <!-- 編集ボタン（インライン編集用） -->
      <button class="edit-btn" style="display:none;">✏️</button>

      <!-- 通常表示 -->
      <div class="view-mode">
        <h3>ﾃﾞｰｽｹ</h3>
        <img src="/images/horses/desuke.jpg" alt="ﾃﾞｰｽｹ">
        <div class="horse-info">
          <p><strong>誕生日　：</strong> 1991/08/06</p>
          <p><strong>年齢　　：</strong> 35</p>
          <p><strong>特徴　　：</strong> 35歳　未勝利</p>
        </div>
      </div>
     <!-- 編集モード（最初は非表示） -->
      <div class="edit-mode" style="display:none;">
        <label>名前</label>
        <input type="text" class="edit-name" value="ﾃﾞｰｽｹ">

        <label>画像</label>
        <input type="file" class="edit-image-file" accept="image/*">

        <label>誕生日</label>
        <input type="text" class="edit-birthday" value="1991/08/06">

        <label>特徴</label>
        <textarea class="edit-desc">35歳　未勝利</textarea>

        <button class="save-btn">保存</button>
        <button class="cancel-btn">キャンセル</button>
      </div>
    </div>
  
</div>

<script src="/scripts/admin.js"></script>

    </main>

    <footer>
      <p>ひめちゃんの支援クラブ</p>
    </footer>

    <!-- js呼び出し -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="/scripts/base.js"></script>

  </body>
</html>
